# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Publish Release

on: workflow_dispatch

jobs:
  build:

    runs-on: windows-latest
    permissions: write-all
      # packages: write
      # contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        # lfs: true
        fetch-depth: 0
        
    # - name: Checkout LFS objects
    #   run: git lfs checkout

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4
      with:
          nuget-version: 'latest'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6

      with:
        dotnet-version: | 
          8.x
          9.x
          10.x
          11.x
        # Authenticates packages to push to GPR
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        check-latest: false
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore dependencies
      run: dotnet restore
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    # - name: Build
    #   run: dotnet build --configuration Release --no-restore

    # - name: Test
    #   run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Pack Excel_PRIME
      run: dotnet pack "Excel_PRIME/Excel_PRIME.csproj" --configuration Release --no-restore
    - name: Pack ExcelFAST
      run: dotnet pack "ExcelFAST/ExcelFAST.csproj" --configuration Release --no-restore

    - name: PushGithub Excel-PRIME
      run: dotnet nuget push **/Excel-PRIME.*.nupkg --no-symbols --skip-duplicate --api-key ${{ secrets.GITHUB_TOKEN }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: PushGithub ExcelFAST
      run: dotnet nuget push **/ExcelFAST.*.nupkg --no-symbols --skip-duplicate --api-key ${{ secrets.GITHUB_TOKEN }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: PushNuget Excel-PRIME
      run: dotnet nuget push **/Excel-PRIME.*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
    - name: PushNuget ExcelFAST
      run: dotnet nuget push **/ExcelFAST.*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

